# gitleaks config — extends the bundled default ruleset and adds a NARROW
# allowlist so the secret scan (.github/workflows/security-scan.yml) stays
# deterministic across gitleaks version bumps (Dependabot updates the pinned
# action over time, and a future rule could tighten to match shorter prefixes).
#
# This allowlists FIXTURES and PREFIX LITERALS only — never a real secret. The
# repo commits no real keys: every .env* is gitignored and none is tracked.
title = "CrewFlow gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known-safe Stripe live-key prefix checks and test fixtures"

# The bare live-key PREFIX (no secret body) — used only for mode detection:
#   lib/stripe/client.ts / lib/payments/portal-stripe.ts: key.startsWith("sk_live_")
#   __tests__/stripe/contract.test.ts: asserts that prefix-detection logic
#   __tests__/monitoring/scrub.test.ts: dummy header value proving redaction
# These carry no real secret body; the exact fixture value is listed so the
# match is surgical rather than a blanket path exemption.
regexes = [
  '''sk_live_abc123''',
  '''startsWith\("sk_live_"\)''',
  # isLiveMode key-kind fixtures (__tests__/stripe/is-live-mode.test.ts): prefix
  # literals with a dummy `abc123` body proving live/test × standard/restricted
  # detection — no real secret body.
  '''rk_live_abc123''',
  '''sk_test_abc123''',
  '''rk_test_abc123''',
  '''pk_live_abc123''',
  # e2e/first-customer-sim.spec.ts: PASSWORD for the local-only synthetic E2E
  # harness account (never a production credential; the account exists only in the
  # ephemeral CI Postgres). generic-api-key matched on entropy (~3.78) of the
  # label-shaped literal. Allowlisted by exact value — surgical, not a path
  # exemption — so real high-entropy strings in that file still trip. (Needed on
  # main because the #997 squash re-keyed the prior .gitleaksignore fingerprint.)
  '''E2e-Harness-Pw-2f9c1a''',
  # __tests__/staff/staff-invite-service.test.ts: HASHED_TOKEN fixture — the fake
  # hashed one-time token the invite/onboarding magic-link test embeds in a
  # /auth/callback?token_hash=… URL. 56-char hex (URL-safe) trips generic-api-key
  # on entropy; carries no real secret. Allowlisted by exact value (surgical).
  '''fb9202308f44aabbccddeeff00112233445566778899aabbccddeeff''',
  # __tests__/lib/destructive-db-guard.test.ts: two FAKE fixtures the prod-guard
  # unit test embeds as inputs. The JWT's signature segment is the literal
  # "SIGNATUREMATERIAL" (a hand-written placeholder, not a signed token), and the
  # DB password is leet-shaped "sup3r-s3cret-db-passw0rd" — both obvious non-secrets
  # used to prove the guard's detection. Allowlisted by their unique literals.
  # (Re-surfaced on main's full-history scan after the #1063 release rewrote the
  # commits these live in, invalidating the prior .gitleaksignore fingerprints —
  # a regex allowlist is stable across such rewrites.)
  '''SIGNATUREMATERIAL''',
  '''sup3r-s3cret-db-passw0rd''',
  # scripts/war-test-seed.mjs: the project's PUBLISHABLE anon key (role=anon,
  # ref=jzntbskdqdopzwdqwvkp) used to seed a local/CI test database. An anon key is
  # designed to ship in client bundles (it is NOT a secret — RLS is the boundary);
  # the service_role key is never committed. gitleaks flags any JWT by shape.
  # Allowlisted by the anon token's unique signature tail (surgical).
  '''qoRrOsCJYmdr9yUc6idY''',
  # docs/hardening/STREAM-PR-MERGE-READINESS.md (a status doc DELETED at HEAD but
  # present in history, commit 8c216488): it QUOTES the placeholder token patterns
  # from __tests__/stripe/sandbox-gate.test.ts / health route-shape fixtures while
  # describing a prior gitleaks finding. These are short, low-entropy word-based
  # placeholders (not real Stripe keys — bodies 9-10 chars, entropy <3, one is
  # literally *LEAKCHECK*); allowlisted by exact value so the push-to-main
  # full-history scan is green. Surgical — a real key on that path would still trip.
  '''rk_live_restricted''',
  '''sk_live_realmoney''',
  '''sk_test_LEAKCHECK''',
]
