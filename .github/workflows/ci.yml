name: CI

# Gates every PR. Fails the merge button if any check fails.
#
# Checks (run in parallel as separate jobs for clear pass/fail rows):
#   - typecheck    (tsc --noEmit)
#   - lint         (eslint via next lint — soon to migrate to next-lint-to-eslint-cli)
#   - tests        (vitest run — unit tier, mocked Supabase)
#   - integration  (vitest run against a REAL Postgres — OQ-16)
#
# The integration job boots the Supabase local stack (`supabase start`),
# applies the actual supabase/migrations on a fresh volume, and runs the
# integration tier (__tests__/integration) to assert RLS, auth, triggers,
# and tenant isolation — behaviour the mocked unit tier structurally cannot
# cover. This closes the gap that previously lived in this comment.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # The test-setup file (__tests__/setup.ts) stubs these defaults,
      # but exporting them again here keeps the intent explicit + lets
      # CI run identically whether or not setup.ts changes.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  integration:
    name: integration (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+ (not 20) is required here: supabase-js eagerly builds a
          # RealtimeClient inside createClient(), and realtime-js needs a global
          # WebSocket — which only exists natively on Node >=22. On Node 20 the
          # harness throws "Node.js 20 detected without native WebSocket support"
          # before a single query runs. The unit `test` job mocks Supabase and
          # never builds a live client, so it deliberately stays on 20.
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund

      # Supabase CLI pinned to the version that generated supabase/config.toml,
      # so `supabase start` parses the config without schema drift. Bump
      # deliberately, alongside a `supabase init` config regeneration.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Boots Postgres + Auth + Storage and applies supabase/migrations on the
      # fresh runner volume. ubuntu-latest ships a running Docker daemon, so no
      # extra container setup is required.
      - name: Start Supabase local stack
        run: supabase start

      # Map the running stack's connection details onto the names the harness
      # reads (__tests__/integration/_harness.ts), then run the integration
      # tier. `set -a` exports each assignment into the test process. CI=true
      # means describeIntegration FAILS LOUDLY (never silently skips) if the DB
      # is somehow absent — so a misconfigured run can never go green.
      - name: Run integration tests
        run: |
          set -a
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.anon_key=SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY)"
          set +a
          for v in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] && echo "$v: set" || echo "$v: MISSING"
          done
          npm run test:integration

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
