name: security-scan

# Supply-chain / secret-hygiene scan — deliberately SEPARATE from ci.yml.
#
# Why its own workflow rather than a seventh job in ci.yml:
#   - ci.yml's `on:` block is pinned by __tests__/ci/workflow-gates.test.ts,
#     which asserts `main` appears exactly twice there. Adding triggers to that
#     block would break that guard. A standalone workflow keeps the six-gate
#     contract untouched.
#   - This scan is GitHub-Actions-only and never builds or boots the app, so it
#     has ZERO Vercel impact (Vercel builds are the metered cost here; GitHub
#     Actions minutes are free for this public repo). It is cheap and
#     deterministic: a filesystem scan for committed secrets, nothing more.
#
# Secret scanning runs the gitleaks CLI (MIT-licensed, free) from its official
# image pinned by DIGEST — NOT the gitleaks-action, whose v2 now requires a paid
# GITLEAKS_LICENSE for org-owned repos and fails closed when it can't validate it.
# The CLI gives identical coverage (same ruleset + .gitleaks.toml + .gitleaksignore).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret introduced in an earlier commit is caught,
          # not just one in the tip. Cheap on GitHub-hosted runners; no Vercel.
          fetch-depth: 0
      # FREE, unlicensed secret scan via the gitleaks CLI.
      #
      # Why not gitleaks/gitleaks-action: the v2 ACTION now requires a paid
      # GITLEAKS_LICENSE for ORG-owned repos (2025 breaking change); when its
      # license check can't reach the API it fails the job ("missing gitleaks
      # license") even though nothing leaked. The gitleaks BINARY is MIT-licensed
      # and free — only the Action wrapper is gated. We run the CLI directly from
      # the official image, pinned by DIGEST (supply-chain hygiene: a moved tag
      # can't swap the code). Equivalent coverage: same ruleset, same
      # .gitleaks.toml, and git-mode so .gitleaksignore fingerprints apply.
      - name: gitleaks (CLI — free, no licence)
        env:
          # zricethezav/gitleaks v8.30.1 — pin by digest, not the moving tag.
          GITLEAKS_IMAGE: "zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
        run: |
          set -euo pipefail
          # PR: scan only the PR's commit range (base..head) — matches the old
          # action's behaviour so a pre-existing finding on the base can't fail an
          # unrelated PR. push to main: scan full history (fetch-depth:0 above).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
            docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
              detect --source /repo --config /repo/.gitleaks.toml --redact --log-opts="$RANGE"
          else
            docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
              detect --source /repo --config /repo/.gitleaks.toml --redact
          fi
